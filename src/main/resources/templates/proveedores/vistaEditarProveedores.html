<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpaPatitas | Administrar Proveedores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="icon" type="image/png" th:href="@{/img/Solo logo Blanco.png}">
    <link rel="stylesheet" th:href="@{/style/principal.css}">
</head>
<body>
<!-- left var -->
<div th:include="admin/template_admin.html::header"></div>

<main>
    <div class="right-content">
        <div class="panel-informacion">
            <h2>Actualiza la información de los proveedores de Spa Patitas: modifica los
                datos de los proveedores existentes.</h2>
        </div>

        <div class="crear-proveedor" style="background-color: #FFFAF9; border-radius: 10px;">

            <h3>Información del Proveedor</h3>

            <div class="container mt-5" style="background-color: #FFFAF9;">
                <form th:action="@{/proveedores/update}" method="post" enctype="multipart/form-data">
                    <div class="row">
                        <input type="hidden" name="nit" th:value="${proveedor.nit}" />
                        <!-- Primer Input -->
                        <div class="col-md-4 mb-3">
                            <label for="nit" class="form-label">NIT</label>
                            <input type="number" class="form-control" name="nit" id="nit" placeholder="Ingresa el NIT" th:value="${proveedor.nit}">
                        </div>
                        <!-- Segundo Input -->
                        <div class="col-md-4 mb-3">
                            <label for="nombre" class="form-label">Nombre del Proveedor</label>
                            <input type="text" class="form-control" name="nombre" id="nombre" placeholder="Ingresa el nombre" th:value="${proveedor.nombre}">
                        </div>
                        <!-- Tercer Input -->
                        <div class="col-md-4 mb-3">
                            <label for="tel" class="form-label">Teléfono</label>
                            <input type="int" class="form-control" name="telefono" id="tel" placeholder="Ingresa el teléfono" th:value="${proveedor.telefono}">
                        </div>
                    </div>

                    <div class="row">
                    </div>

                    <div class="row">
                        <!-- Cuarto Input -->
                        <div class="col-md-4 mb-3">
                            <label for="direc" class="form-label">Dirección</label>
                            <input type="text" class="form-control" name="direccion" id="direc" placeholder="Ingresa la dirección" th:value="${proveedor.direccion}">
                        </div>
                        <!-- Quinto Input -->
                        <div class="col-md-4 mb-3">
                            <label for="correo" class="form-label">Correo</label>
                            <input type="text" class="form-control" name="correo" id="correo" placeholder="Ingresa el correo" th:value="${proveedor.correo}">
                        </div>
                        <!-- Sexto Input -->
                        <div class="col-md-4 mb-3">
                            <label for="estado" class="form-label">Estado</label>
                            <select class="form-select" name="estado" id="estado" th:value="${proveedor.estado}" aria-label="Default select example">
                                <option selected>Seleccione el Estado</option>
                                <option value="true" style="background-color: #FFFFFF;" th:selected="${proveedor.estado == true}">HABILITADO</option>
                                <option value="false" style="background-color: #FFFFFF;" th:selected="${proveedor.estado == false}">DESHABILITADO</option>
                            </select>
                        </div>
                    </div>

                    <div class="row">
                        <!-- Botones de Guardar y Cancelar -->
                        <div id="botones" class="col-md-4 mb-3" style="display: flex;">
                            <button type="submit" class="btn btn-primary w-50 me-2" style="background-color: #F2B243; border-style: none;">Guardar</button>
                            <button type="button" class="btn btn-secondary w-50" onclick="window.location.href='/proveedores'">Cancelar</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    <!-- Footer -->
    <div th:include="admin/template_admin.html::footer"></div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
