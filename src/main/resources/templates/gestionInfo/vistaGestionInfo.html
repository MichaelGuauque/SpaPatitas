<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpaPatitas | Gestionar Informacion</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="icon" type="image/png" th:href="@{/img/Solo logo Blanco.png}">
  <link rel="stylesheet" th:href="@{/style/stylAm.css}">

</head>
<body>
<!-- left var -->
<div th:include="admin/template_admin.html::header"></div>

<main>

  <!-- Primer Formulario -->
  <div class="right-content">
    <div class="panel-informacion">

      <h2>Modifica el contenido de las secciones principales visibles para los usuarios de Spa Patitas, incluyendo PQRS, Ayuda, Términos y Condiciones, y Quiénes Somos.</h2>
    </div>

    <div class="crear-promo" style="background-color: #FFFAF9; border-radius: 10px;">

      <h3 class="titulosDiv">Quienes Somos</h3>

      <div class="container mt-4">
        <form id="form1" th:action="@{/gestionInfo/actualizar}" th:object="${gestionInfo}" method="post">
          <div class="mb-3">
            <label for="info" class="form-label">Información</label>
            <textarea class="form-control" id="info" name="informacion" th:text="*{informacion}" rows="5" placeholder="Ingrese información sobre quienes somos"></textarea>
          </div>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="mision" class="form-label">Misión</label>
              <textarea class="form-control" id="mision" name="mision" th:text="*{mision}" rows="5" placeholder="Ingrese información sobre la mision"></textarea>
            </div>
            <div class="col-md-6 mb-3">
              <label for="vision" class="form-label">Visión</label>
              <textarea class="form-control" id="vision" name="vision" th:text="*{vision}" rows="5" placeholder="Ingrese información sobre la vision"></textarea>
            </div>
          </div>
          <!-- Campos ocultos para el resto de los datos -->
          <input type="hidden" name="infoAdicional" th:value="*{infoAdicional}" />
          <input type="hidden" name="contacto" th:value="*{contacto}" />
          <input type="hidden" name="agendamientoCitas" th:value="*{agendamientoCitas}" />
          <input type="hidden" name="compraProductos" th:value="*{compraProductos}" />
          <input type="hidden" name="metodosPago" th:value="*{metodosPago}" />
          <input type="hidden" name="cuentaPerfil" th:value="*{cuentaPerfil}" />
          <input type="hidden" name="contactoAdicional" th:value="*{contactoAdicional}" />
          <input type="hidden" name="definiciones" th:value="*{definiciones}" />
          <input type="hidden" name="usoSitioWeb" th:value="*{usoSitioWeb}" />
          <input type="hidden" name="cuentasRegistro" th:value="*{cuentasRegistro}" />
          <input type="hidden" name="codicionesVenta" th:value="*{codicionesVenta}" />
          <input type="hidden" name="condicionesAgendamiento" th:value="*{condicionesAgendamiento}" />
          <input type="hidden" name="limitacionesResponsabilidad" th:value="*{limitacionesResponsabilidad}" />
          <input type="hidden" name="propiedadIntelectual" th:value="*{propiedadIntelectual}" />
          <input type="hidden" name="politicaPrivacidad" th:value="*{politicaPrivacidad}" />
          <input type="hidden" name="modificacionTerminos" th:value="*{modificacionTerminos}" />
          <input type="hidden" name="aceptacionTerminos" th:value="*{aceptacionTerminos}" />

          <div id="botones" class="col-md-4 mb-3" style="display: flex;">
            <button type="submit" class="btn btn-primary w-50 me-2" style="background-color: #F2B243; border-style: none;">Guardar</button>

          </div>
        </form>



      </div>

    </div>
  </div>


  <!-- Segundo Formulario -->
  <div class="right-content">


    <div class="crear-promo" style="background-color: #FFFAF9; border-radius: 10px; margin-top: 1.2%;">

      <h3 class="titulosDiv">PQRS</h3>

      <div class="container mt-4">
        <form id="form2" th:action="@{/gestionInfo/actualizar}" th:object="${gestionInfo}" method="post">
          <div class="mb-3">
            <label for="infoAdicional" class="form-label">Información Adicional</label>
            <textarea class="form-control" id="infoAdicional" name="infoAdicional" th:text="*{infoAdicional}" rows="5" placeholder="Ingrese la información"></textarea>
          </div>
          <div class="mb-3">
            <label for="contacto" class="form-label">Contacto</label>
            <textarea class="form-control" id="contacto" name="contacto" th:text="*{contacto}" rows="5" placeholder="Ingrese información de contacto"></textarea>
          </div>

          <!-- Campos ocultos -->
          <input type="hidden" name="informacion" th:value="*{informacion}" />
          <input type="hidden" name="mision" th:value="*{mision}" />
          <input type="hidden" name="vision" th:value="*{vision}" />
          <input type="hidden" name="agendamientoCitas" th:value="*{agendamientoCitas}" />
          <input type="hidden" name="compraProductos" th:value="*{compraProductos}" />
          <input type="hidden" name="metodosPago" th:value="*{metodosPago}" />
          <input type="hidden" name="cuentaPerfil" th:value="*{cuentaPerfil}" />
          <input type="hidden" name="contactoAdicional" th:value="*{contactoAdicional}" />
          <input type="hidden" name="definiciones" th:value="*{definiciones}" />
          <input type="hidden" name="usoSitioWeb" th:value="*{usoSitioWeb}" />
          <input type="hidden" name="cuentasRegistro" th:value="*{cuentasRegistro}" />
          <input type="hidden" name="codicionesVenta" th:value="*{codicionesVenta}" />
          <input type="hidden" name="condicionesAgendamiento" th:value="*{condicionesAgendamiento}" />
          <input type="hidden" name="limitacionesResponsabilidad" th:value="*{limitacionesResponsabilidad}" />
          <input type="hidden" name="propiedadIntelectual" th:value="*{propiedadIntelectual}" />
          <input type="hidden" name="politicaPrivacidad" th:value="*{politicaPrivacidad}" />
          <input type="hidden" name="modificacionTerminos" th:value="*{modificacionTerminos}" />
          <input type="hidden" name="aceptacionTerminos" th:value="*{aceptacionTerminos}" />


          <div id="botones2" class="col-md-4 mb-3" style="display: flex;">
            <button type="submit" class="btn btn-primary w-50 me-2" style="background-color: #F2B243; border-style: none;">Guardar</button>

          </div>
        </form>

      </div>
    </div>
  </div>

  <!-- Tercer Formulario -->
  <div class="right-content">
    <div class="crear-promo" style="background-color: #FFFAF9; border-radius: 10px; margin-top: 1.2%;">
      <h3 id="titulosDiv">Centro de Ayuda</h3>
      <div class="container mt-4">
        <form th:action="@{/gestionInfo/actualizar}" th:object="${gestionInfo}" method="post">
          <!-- Primera fila: Input para agendamiento de citas -->
          <div class="mb-3">
            <label for="agendamientoCitas" class="form-label">Agendamiento de Citas</label>
            <textarea class="form-control" id="agendamientoCitas" name="agendamientoCitas"
                      th:text="*{agendamientoCitas}" rows="5" placeholder="Ingrese información sobre agendamiento de citas"></textarea>
          </div>

          <!-- Segunda fila: Input para compra de productos -->
          <div class="mb-3">
            <label for="compraProductos" class="form-label">Compra de Productos</label>
            <textarea class="form-control" id="compraProductos" name="compraProductos"
                      th:text="*{compraProductos}" rows="5" placeholder="Ingrese información sobre compra de productos"></textarea>
          </div>

          <!-- Tercera fila: Input para métodos de pago -->
          <div class="mb-3">
            <label for="metodosPago" class="form-label">Métodos de Pago</label>
            <textarea class="form-control" id="metodosPago" name="metodosPago"
                      th:text="*{metodosPago}" rows="5" placeholder="Ingrese información sobre métodos de pago"></textarea>
          </div>

          <!-- Cuarta fila: Input para cuenta y perfil -->
          <div class="row mb-3">
            <div class="col-md-6">
              <label for="cuentaPerfil" class="form-label">Cuenta y Perfil</label>
              <textarea class="form-control" id="cuentaPerfil" name="cuentaPerfil"
                        th:text="*{cuentaPerfil}" rows="5" placeholder="Ingrese información sobre cuenta y perfil"></textarea>
            </div>

            <div class="col-md-6">
              <label for="contactoAdicional" class="form-label">Contacto Adicional</label>
              <textarea class="form-control" id="contactoAdicional" name="contactoAdicional"
                        th:text="*{contactoAdicional}" rows="5" placeholder="Ingrese información de contacto adicional"></textarea>
            </div>
          </div>

          <!-- Campos ocultos para los datos de las otras secciones -->
          <input type="hidden" name="informacion" th:value="*{informacion}" />
          <input type="hidden" name="mision" th:value="*{mision}" />
          <input type="hidden" name="vision" th:value="*{vision}" />
          <input type="hidden" name="infoAdicional" th:value="*{infoAdicional}" />
          <input type="hidden" name="contacto" th:value="*{contacto}" />
          <input type="hidden" name="definiciones" th:value="*{definiciones}" />
          <input type="hidden" name="usoSitioWeb" th:value="*{usoSitioWeb}" />
          <input type="hidden" name="cuentasRegistro" th:value="*{cuentasRegistro}" />
          <input type="hidden" name="codicionesVenta" th:value="*{codicionesVenta}" />
          <input type="hidden" name="condicionesAgendamiento" th:value="*{condicionesAgendamiento}" />
          <input type="hidden" name="limitacionesResponsabilidad" th:value="*{limitacionesResponsabilidad}" />
          <input type="hidden" name="propiedadIntelectual" th:value="*{propiedadIntelectual}" />
          <input type="hidden" name="politicaPrivacidad" th:value="*{politicaPrivacidad}" />
          <input type="hidden" name="modificacionTerminos" th:value="*{modificacionTerminos}" />
          <input type="hidden" name="aceptacionTerminos" th:value="*{aceptacionTerminos}" />

          <!-- Botones de Enviar y Cancelar -->
          <div id="botones3" class="col-md-4 mb-3" style="display: flex;">
            <button type="submit" class="btn btn-primary w-50 me-2" style="background-color: #F2B243; border-style: none;">Guardar</button>

          </div>
        </form>
      </div>
    </div>
  </div>


  <div class="right-content">
    <div class="crear-promo" style="background-color: #FFFAF9; border-radius: 10px; margin-top: 1.2%;">
      <h3 class="titulosDiv">Términos y Condiciones</h3>
      <div class="container mt-4">
        <form th:action="@{/gestionInfo/actualizar}" th:object="${gestionInfo}" method="post">

          <!-- Definiciones y Cuentas y Registro -->
          <div class="row mb-3">
            <div class="col-md-6">
              <label for="definiciones" class="form-label">Definiciones</label>
              <textarea class="form-control" id="definiciones" name="definiciones"
                        th:text="*{definiciones}" rows="5" placeholder="Ingrese definiciones"></textarea>
            </div>
            <div class="col-md-6">
              <label for="cuentasRegistro" class="form-label">Cuentas y Registro</label>
              <textarea class="form-control" id="cuentasRegistro" name="cuentasRegistro"
                        th:text="*{cuentasRegistro}" rows="5" placeholder="Ingrese información sobre cuentas y registro"></textarea>
            </div>
          </div>

          <!-- Uso del Sitio Web -->
          <div class="mb-3">
            <label for="usoSitioWeb" class="form-label">Uso del Sitio Web</label>
            <textarea class="form-control" id="usoSitioWeb" name="usoSitioWeb"
                      th:text="*{usoSitioWeb}" rows="5" placeholder="Ingrese información sobre el uso del sitio web"></textarea>
          </div>

          <!-- Condiciones de Venta y Agendamiento de Servicios -->
          <div class="row mb-3">
            <div class="col-md-6">
              <label for="codicionesVenta" class="form-label">Condiciones de Venta de Productos</label>
              <textarea class="form-control" id="codicionesVenta" name="codicionesVenta"
                        th:text="*{codicionesVenta}" rows="5" placeholder="Ingrese información sobre condiciones de venta"></textarea>
            </div>
            <div class="col-md-6">
              <label for="condicionesAgendamiento" class="form-label">Condiciones de Agendamiento de Servicios</label>
              <textarea class="form-control" id="condicionesAgendamiento" name="condicionesAgendamiento"
                        th:text="*{condicionesAgendamiento}" rows="5" placeholder="Ingrese información sobre agendamiento de servicios"></textarea>
            </div>
          </div>

          <!-- Limitación de Responsabilidad -->
          <div class="mb-3">
            <label for="limitacionesResponsabilidad" class="form-label">Limitación de Responsabilidad</label>
            <textarea class="form-control" id="limitacionesResponsabilidad" name="limitacionesResponsabilidad"
                      th:text="*{limitacionesResponsabilidad}" rows="5" placeholder="Ingrese información sobre limitaciones de responsabilidad"></textarea>
          </div>

          <!-- Propiedad Intelectual -->
          <div class="mb-3">
            <label for="propiedadIntelectual" class="form-label">Propiedad Intelectual</label>
            <textarea class="form-control" id="propiedadIntelectual" name="propiedadIntelectual"
                      th:text="*{propiedadIntelectual}" rows="5" placeholder="Ingrese información sobre propiedad intelectual"></textarea>
          </div>

          <!-- Política de Privacidad -->
          <div class="mb-3">
            <label for="politicaPrivacidad" class="form-label">Política de Privacidad</label>
            <textarea class="form-control" id="politicaPrivacidad" name="politicaPrivacidad"
                      th:text="*{politicaPrivacidad}" rows="5" placeholder="Ingrese información sobre política de privacidad"></textarea>
          </div>

          <!-- Modificación de los Términos -->
          <div class="row mb-3">
            <div class="col-md-6">
              <label for="modificacionTerminos" class="form-label">Modificación de los Términos</label>
              <textarea class="form-control" id="modificacionTerminos" name="modificacionTerminos"
                        th:text="*{modificacionTerminos}" rows="5" placeholder="Ingrese información sobre modificación de los términos"></textarea>
            </div>

            <div class="col-md-6">
              <label for="aceptacionTerminos" class="form-label">Aceptación de los Términos</label>
              <textarea class="form-control" id="aceptacionTerminos" name="aceptacionTerminos"
                        th:text="*{aceptacionTerminos}" rows="5" placeholder="Ingrese información sobre aceptación de los términos"></textarea>
            </div>
          </div>

          <!-- Campos ocultos -->
          <input type="hidden" name="informacion" th:value="*{informacion}" />
          <input type="hidden" name="mision" th:value="*{mision}" />
          <input type="hidden" name="vision" th:value="*{vision}" />
          <input type="hidden" name="infoAdicional" th:value="*{infoAdicional}" />
          <input type="hidden" name="contacto" th:value="*{contacto}" />
          <input type="hidden" name="agendamientoCitas" th:value="*{agendamientoCitas}" />
          <input type="hidden" name="compraProductos" th:value="*{compraProductos}" />
          <input type="hidden" name="metodosPago" th:value="*{metodosPago}" />
          <input type="hidden" name="cuentaPerfil" th:value="*{cuentaPerfil}" />
          <input type="hidden" name="contactoAdicional" th:value="*{contactoAdicional}" />

          <!-- Botones -->
          <div id="botones4" class="col-md-4 mb-3" style="display: flex;">
            <button type="submit" class="btn btn-primary w-50 me-2" style="background-color: #F2B243; border-style: none;">Guardar</button>

          </div>
        </form>
      </div>
    </div>
  </div>




  <!-- Footer -->
<div th:include="admin/template_admin.html::footer"></div>

</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>




</body>
</html>
