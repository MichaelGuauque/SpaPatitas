<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpaPatitas | Promociones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="icon" type="image/png" th:href="@{/img/Solo logo Blanco.png}">
    <link rel="stylesheet" th:href="@{/style/principal.css}">
</head>
<body>
<!-- left var -->
    <div th:include="admin/template_admin.html::header"></div>

    <main>
    <div class="right-content">
        <div class="panel-informacion">
            <h2>Administra las promociones y descuentos de Spa Patitas: consulta las promociones activas, añade nuevas ofertas y modifica las promociones existentes.</h2>
        </div>

        <div class="crear-promo" style="background-color: #FFFAF9; border-radius: 10px;">
            
                <h3>Información Promocion</h3>
            
            <!-- Primera Fila: ID de Promoción, ID de Producto, ID de Servicio -->
            <div id="promocionesDiv">
                <div class="row mb-3">

                    <div class="row">
                        <!-- Fila 1 -->
                        <div class="col-md-6" style="gap: 8px;">
                            <label for="codigoProducto" class="form-label">Buscar producto por código</label>
                            <form th:action="@{/promociones/buscar}" method="get">
                                <div class="input-group">
                                    <input class="buscador form-control" min="1" style="height: 40px;" name="codigo" type="number" placeholder="Código del producto" id="codigoProducto" required>
                                    <button class="boton-buscar btn btn-outline-secondary" style="height: 40px;" type="submit">
                                        <img th:src="@{/img/Search.png}" alt="Buscar" width="20" height="20">
                                    </button>
                                </div>
                                <div class="col-md-6" >
                                    <label for="nombreProducto" class="form-label">Nombre del producto</label>
                                    <input type="text" class="form-control" id="nombreProducto" th:value="${producto != null ? producto.nombre : ''}" placeholder="Nombre del producto" readonly>
                                </div>
                            </form>
                        </div>
                    </div>
                    <form th:action="@{/promociones/guardar}" method="post">
                     <!-- Segunda Fila: Valor del Descuento y Estado -->
                        <div class="row mb-3" style="margin-top: 20px;">
                            <input type="hidden" name="codigo" th:value="${producto != null ? producto.codigo : ''}">
                            <div class="col-md-6">
                                <label for="valorDescuento" class="form-label">Valor del Descuento</label>
                                <input type="number" min="1" name="porcentajeDescuento" class="form-control" id="valorDescuento" placeholder="Ingresa el porcentaje descuento (ej: 3)" required>
                            </div>
                            <div class="col-md-6">
                                <label for="estado" class="form-label">Estado de la Promoción</label>
                                    <select class="form-select" id="estado" name="estado" required>
                                        <option selected>Seleccione el Estado</option>
                                        <option value="1" style="background-color: #FFFFFF;">HABILITADO</option>
                                        <option value="0" style="background-color: #FFFFFF;">DESHABILITADO</option>
                                    </select>
                            </div>
                        </div>
                        <div class="row">
                                <!-- Botones de Enviar y Cancelar -->
                            <div id="botones" class="col-md-4 mb-3" style="display: flex;">
                                <button type="submit" class="btn btn-primary w-50 me-2" style="background-color: #F2B243; border-style: none;">Guardar</button>
                                <button type="button" class="btn btn-secondary w-50" onclick="resetFormAndShowAlert()">Cancelar</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <div class="tablaPromo">
            <div class="tabla-encabezado">
                <h3 id="pequeñ">Promociones</h3>
                <div>
                    <form>
                        <input class="buscador" type="number" placeholder="ID Promocion.">
                        <button class="boton-buscar" type="submit"><img th:src="@{/img/Search.png}"></button>
                    </form>
                </div>
            </div>
            <table id="tablita" class="table table-striped table-hover">
                <thead>
                    <tr>
                      <th scope="col">Codigo Promocion</th>
                      <th scope="col">Descuento</th>
                      <th scope="col">Cod Producto</th>
                      <th scope="col">Estado</th>
                      <th scope="col">Acción</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr th:each="p:${promociones}">
                      <th scope="row" th:text="${p.id}"></th>
                      <td th:text="${p.procentajeDescuento} + '%'"></td>
                      <td th:text="${p.producto.codigo}"></td>
                      <td th:text="(${p.estado} ? 'Habilitado' : 'Deshabilitado')"></td>
                      <td style="display: flex; flex-direction: column; gap: 7px;">
                          <form th:action="@{/promociones/cambiarEstado/{id}(id=${p.id})}" method="post">
                              <button type="submit" class="btn btn-secondary" id="botonesMasco" >
                                  <span th:text="${p.estado} ? 'Deshabilitar' : 'Habilitar'"></span>
                              </button>
                          </form>
                    </td>
                    </tr>
                  </tbody>
            </table>
        </div>
    </div>

    <!-- Footer -->
    <div th:include="admin/template_admin.html::footer"></div>
</main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>


<script>
    // Función para reiniciar el formulario y mostrar el mensaje de cancelación
    function resetFormAndShowAlert() {
        const form = document.querySelector('form'); // Selecciona el formulario
        form.reset(); // Limpia los campos del formulario

        const alertaCancelacion = document.getElementById('alerta-cancelacion');
        alertaCancelacion.style.display = "block"; // Muestra la alerta de cancelación

        // Ocultar automáticamente la alerta después de 3 segundos
        setTimeout(() => {
            alertaCancelacion.style.display = "none";
        }, 3000);
    }
</script>
</body>
</html>
