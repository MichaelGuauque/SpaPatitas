<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpaPatitas | Home </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="icon" type="image/png" th:href="@{/img/Solo logo Blanco.png}">
    <link rel="stylesheet" th:href="@{/style/principal.css}">
    <link rel="stylesheet" th:href="@{/style/homeAdmin.css}">
</head>
<body>
<!-- left var -->
    <div th:include="admin/template_admin.html::header"></div>
    <main>
    <div class="right-content" style="margin-top: 2rem">
        <div class="right-content-info">
            <div class="right-content-info-izquierda">
                <h1 class="titulo-administracion">Panel de Administración Spa Patitas</h1>
                <p class="texto">Bienvenido al panel de administración de Spa Patitas. Aquí puedes gestionar citas,
                    servicios, productos y usuarios, y visualizar un resumen de las actividades recientes.</p>
                <img class="img-linea" th:src="@{/img/Line.png}">
                <div class="botones-enlace">
                    <a class="boton-producto-admin" th:href="@{/productos}">Agregar Producto</a>
                    <a class="boton-cliente" th:href="@{/clientes}">Agregar Cliente </a>
                </div>
                <div class="botones-enlace">
                    <a class="boton-servicio" th:href="@{/servicios}">Agregar Servicio </a>
                    <a class="boton-promocion" th:href="@{/promociones}">Agregar Promoción </a>
                </div>
            </div>
            <div class="right-content-info-derecha">
                <img class="img-relleno" th:src="@{/img/relleno.png}">
            </div>
        </div>
    </div>
    <!-- Footer -->
    <div th:include="admin/template_admin.html::footer"></div>
</main>
</body>
</html>
