<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpaPatitas | Mis Mascotas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="icon" type="image/png" th:href="@{/img/Solo logo Blanco.png}">
    <link rel="stylesheet" th:href="@{/style/principal.css}">

</head>
<body>
<!-- left var -->
<div th:include="user/template_user.html::header-user"></div>

<main>
    <div class="right-content">
        <div class="panel-informacionText">
            <h3>Registrar Mascota</h3>
            <h2>¡Registra a tu mascota en Spa Patitas y facilita la gestión de citas y servicios personalizados!</h2>
            <h2>Completa el siguiente formulario con los datos de tu mascota para que podamos brindarle la mejor atención posible.</h2>
        </div>

        <div class="crear-promo" style="background-color: #FFFAF9; border-radius: 10px;">

            <h3>Actualiza los Datos de tu Mascota</h3>

            <!-- Primera Fila: ID de Promoción, ID de Producto, ID de Servicio -->
            <div id="promocionesDiv">
                <div class="row mb-3">
                    <form th:action="@{/mascotas/actualizar}" method="post" enctype="multipart/form-data">
                        <div class="row mb-3">
                            <!-- Primer Imput Oculto -->
                            <input type="hidden" name="id" th:value="${mascota.id}" />
                            <!-- Nombre de la mascota -->
                            <div class="col-md-4">
                                <label for="nombre" class="form-label">Nombre</label>
                                <input type="text" class="form-control" id="nombre" name="nombre" required placeholder="Ingresa el nombre de la mascota" th:value="${mascota.nombre}" >
                            </div>

                            <!-- Raza de la mascota -->
                            <div class="col-md-4">
                                <label for="raza" class="form-label">Raza</label>
                                <input type="text" class="form-control" id="raza" name="raza" required placeholder="Ingresa la raza" th:value="${mascota.raza}">
                            </div>

                            <!-- Fecha de nacimiento -->
                            <div class="col-md-4">
                                <label for="fechaNacimiento" class="form-label">Fecha de nacimiento</label>
                                <input type="date" class="form-control" name="fechaNacimiento" required id="fechaNacimiento" th:value="${mascota.fechaNacimiento}" >
                            </div>
                        </div>

                        <div class="row mb-3">
                            <!-- Observaciones -->
                            <div class="col-md-6">
                                <label for="observaciones" class="form-label">Observaciones</label>
                                <textarea class="form-control" id="observaciones" name="observaciones" rows="3"   placeholder="Escribe alguna observación" th:text="${mascota.observaciones}"></textarea>
                            </div>

                            <!-- Estado (habilitado o deshabilitado) -->
                            <div class="col-md-6">
                                <label for="estado" class="form-label">Estado</label>
                                <select class="form-select" name="estado" id="estado" th:value="${mascota.estado}" required>
                                    <option value="1" style="background-color: #FFFFFF;"  th:selected="${mascota.estado == true}">Habilitado</option>
                                    <option value="0" style="background-color: #FFFFFF;" th:selected="${mascota.estado == false}">Deshabilitado</option>
                                </select>
                            </div>
                        </div>

                        <div class="row">
                            <!-- Botones de Enviar y Cancelar -->
                            <div id="botones" class="col-md-4 mb-3" style="display: flex;">
                                <button type="submit" class="btn btn-primary w-50 me-2" style="background-color: #F2B243; border-style: none;">Guardar</button>
                                <button type="button" class="btn btn-secondary w-50" onclick="window.history.back()">Cancelar</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

        <!-- Footer -->
        <div th:include="admin/template_admin.html::footer"></div>

</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>


</body>
</html>
