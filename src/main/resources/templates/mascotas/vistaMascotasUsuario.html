<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpaPatitas | Mis Mascotas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="icon" type="image/png" th:href="@{/img/Solo logo Blanco.png}">
    <link rel="stylesheet" th:href="@{/style/stylAm.css}">

</head>
<body>
<!-- left var -->
<div th:include="user/template_user.html::header-user"></div>

<main>
    <div class="right-content">
        <div class="panel-informacionText">
            <h3>Registrar Mascota</h3>
            <h2>¡Registra a tu mascota en Spa Patitas y facilita la gestión de citas y servicios personalizados!</h2>
            <h2>Completa el siguiente formulario con los datos de tu mascota para que podamos brindarle la mejor atención posible.</h2>
        </div>

        <div class="crear-promo" style="background-color: #FFFAF9; border-radius: 10px;">

            <h3>Registra Tu Mascota</h3>

            <!-- Primera Fila: ID de Promoción, ID de Producto, ID de Servicio -->
            <div id="promocionesDiv">
                <div class="row mb-3">
                    <form th:action="@{/mascotas/crear}" method="post" enctype="multipart/form-data">
                        <div class="row mb-3">
                            <!-- Nombre de la mascota -->
                            <div class="col-md-4">
                                <label for="nombre" class="form-label">Nombre</label>
                                <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Ingresa el nombre de la mascota" required>
                            </div>

                            <!-- Raza de la mascota -->
                            <div class="col-md-4">
                                <label for="raza" class="form-label">Raza</label>
                                <input type="text" class="form-control" id="raza" name="raza" placeholder="Ingresa la raza" required>
                            </div>

                            <!-- Fecha de nacimiento -->
                            <div class="col-md-4">
                                <label for="fechaNacimiento" class="form-label">Fecha de nacimiento</label>
                                <input type="date" class="form-control" name="fechaNacimiento" id="fechaNacimiento" required>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <!-- Observaciones -->
                            <div class="col-md-6">
                                <label for="observaciones" class="form-label">Observaciones</label>
                                <textarea class="form-control" id="observaciones" name="observaciones" rows="3" placeholder="Escribe alguna observación"></textarea>
                            </div>

                            <!-- Estado (habilitado o deshabilitado) -->
                            <div class="col-md-6">
                                <label for="estado" class="form-label">Estado</label>
                                <select class="form-select" name="estado" id="estado" required>
                                    <option value="1">Habilitado</option>
                                    <option value="0">Deshabilitado</option>
                                </select>
                            </div>
                        </div>

                        <div class="row">
                            <!-- Botones de Enviar y Cancelar -->
                            <div id="botones" class="col-md-4 mb-3" style="display: flex;">
                                <button type="submit" class="btn btn-primary w-50 me-2" style="background-color: #F2B243; border-style: none;" >Guardar</button>
                                <button type="button" class="btn btn-secondary w-50" onclick="resetFormAndShowAlert()">Cancelar</button>
                            </div>

                            <!-- Alerta de Cancelación -->
                            <div id="alerta-cancelacion" class="alert alert-warning alert-dismissible fade show" role="alert" style="display: none;">
                                Proceso cancelado.
                                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                            </div>

                        </div>

                        <script>
                            // Función para reiniciar el formulario y mostrar el mensaje de cancelación
                            function resetFormAndShowAlert() {
                                const form = document.querySelector('form'); // Selecciona el formulario
                                form.reset(); // Limpia los campos del formulario

                                const alertaCancelacion = document.getElementById('alerta-cancelacion');
                                alertaCancelacion.style.display = "block"; // Muestra la alerta de cancelación

                                // Ocultar automáticamente la alerta después de 3 segundos
                                setTimeout(() => {
                                    alertaCancelacion.style.display = "none";
                                }, 3000);
                            }
                        </script>
                    </form>
                </div>
            </div>
        </div>

        <div class="tablaPromo">
            <div class="tabla-encabezado">
                <h3 id="pequeñ">Mis Mascotas</h3>
            </div>
            <table class="table">
                <tbody>
                <!-- Fila 1 -->
                <tr th:each="mascota:${mascotas}">
                    <td>
                        <div class="d-flex align-items-start justify-content-between" id="regMascota">
                            <!-- Contenido de la fila -->
                            <div class="d-flex align-items-start">
                                <img th:src="@{/img/paw.png}" alt="Imagen" class="me-3" style="width: 148px; height: 122px; object-fit: cover;">
                                <div>
                                    <h5 class="mb-1" id="nombreMascota" th:text="${mascota.nombre}" ></h5>
                                    <h6 class="text-muted mb-2" id="razaMascota" th:text="${mascota.raza}" ></h6>
                                    <p class="mb-0" id="descripMascota" th:text="${mascota.observaciones}" ></p>
                                </div>
                            </div>
                            <!-- Botones -->
                            <div class="d-flex flex-column justify-content-right" id="cajonBotones">
                                <a class="btn btn-primary mb-2" id="botonesMasco2" th:href="@{/mascotas/editar/{id}(id=${mascota.id})}">Modificar</a>
                                 <form th:action="@{/mascotas/cambiarEstado/{id}(id=${mascota.id})}" method="post">
                                     <button type="submit" class="btn btn-secondary" id="botonesMasco">
                                         <span th:text="${mascota.estado} ? 'Deshabilitar' : 'Habilitar'"></span>
                                     </button>
                                 </form>


                            </div>
                         </div>
                     </td>
                 </tr>

                 </tbody>
             </table>
         </div>
     </div>
     <!-- Footer -->
    <div th:include="admin/template_admin.html::footer"></div>

</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>


</body>
</html>
