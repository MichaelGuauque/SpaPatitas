<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpaPatitas | Administrar Citas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="icon" type="image/png" th:href="@{/img/Logo solo-02-02.png}">
    <link rel="stylesheet" th:href="@{/style/principal.css}">
    <link rel="stylesheet" th:href="@{/style/citas.css}">
</head>
<body>
<!-- left var -->
<div th:include="admin/template_admin.html::header"></div>

<main>
    <div class="right-content">
        <div class="panel-informacion">
            <h2>Administra todas las citas programadas en Spa Patitas. Desde aquí, puedes consultar el estado de cada
                cita, realizar modificaciones y habilitar o deshabilitar citas según sea necesario.</h2>
        </div>

        <div class="right-content-info-citas">

            <div class="right-content-info-izquierda-citas">

                <h8 id="tituloPrincipal">Programación Cita</h8>

                <div class="container mt-4 px-4">

                    <div class="row mb-3" style="margin-top: 20px;">

                        <form class="row g-4" th:action="@{/citas/crear}" method="post" enctype="multipart/form-data">

                            <div class="col-md-6">
                                <label for="fechaCita" class="form-label">Selecciona una Fecha:</label>
                                <input type="date" id="fechaCita" name="fechaCita" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label for="horaCita" class="form-label">Selecciona una Hora:</label>
                                <select id="horaCita" name="horaCita" class="form-select" required>
                                    <option value="" disabled selected>Elige una hora</option>
                                    <option value="8:00">8:00 AM</option>
                                    <option value="9:00">9:00 AM</option>
                                    <option value="10:00">10:00 AM</option>
                                    <option value="11:00">11:00 AM</option>
                                    <option value="12:00">12:00 PM</option>
                                    <option value="13:00">1:00 PM</option>
                                    <option value="14:00">2:00 PM</option>
                                    <option value="15:00">3:00 PM</option>
                                    <option value="16:00">4:00 PM</option>
                                    <option value="17:00">5:00 PM</option>
                                </select>
                            </div>

                            <div class="col-12">
                                <label class="form-label fw-bold" style="font-size: 1.2rem;">Seleccione el servicio de
                                    la
                                    cita:</label>
                                <div th:each="servicio : ${servicios}" class="form-check form-check-lg mb-2">
                                    <input class="form-check-input" type="checkbox"
                                           th:value="${servicio.idTipoServicio}"
                                           th:id="'servicio-' + ${servicio.idTipoServicio}"
                                           th:name="serviciosSeleccionados"
                                           style="transform: scale(1.3);">
                                    <label class="form-check-label"
                                           th:for="'service-' + ${servicio.idTipoServicio} " style="font-size: 1.2rem;">
                                        <span th:text="${servicio.descripcion}"></span>
                                    </label>
                                </div>
                            </div>
                            <div class="col-12">
                                <!-- Botones de Enviar y Cancelar -->
                                <div id="botones" class="d-flex justify-content-center gap-3 mt-3">
                                    <button type="submit" class="btn btn-primary w-25"
                                            style="background-color: #F2B243; border-style: none;">Asignar
                                    </button>
                                    <button type="button" class="btn btn-secondary w-25"
                                            onclick="window.location.href='/'">
                                        Cancelar
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>

            </div>

            <div class="right-content-info-derecha-citas">
                <img class="img-relleno-citas" src="./img/relleno.png">
            </div>
        </div>
        <div class="tablaPromo-citas">
            <div class="tabla-encabezado">
                <h3 id="pequeño">Citas Programadas</h3>
            </div>
            <table class="table">
                <tbody>

                <tr>
                    <td>
                        <div class="d-flex align-items-center justify-content-between" id="regCita">
                            <!-- Contenido de la fila -->
                            <div class="d-flex align-items-center">
                                <img th:src="@{/img/Calendar_.png}" alt="Imagen" class="me-3"
                                     style="width: 51.7px; height: 59px; display: flex; align-items: center;justify-content: center">
                                <div>
                                    <h5 class="mb-1" id="diaCita">Día de la Cita:</h5>
                                    <h6 class="text-muted mb-2" id="horaCitas">Hora de la Cita:</h6>
                                    <p class="mb-0" id="serviciosCita">Servicios de la cita:</p>
                                </div>
                            </div>
                            <!-- Botones -->
                            <div class="d-flex flex-column justify-content-center" id="cajonBotones">
                                <button class="btn btn-primary mb-2" id="botonesCita2">Modificar</button>
                                <button class="btn btn-secondary" id="botonesCita">Cancelar</button>
                            </div>
                        </div>
                    </td>
                </tr>


                </tbody>
            </table>
        </div>
    </div>

    <!-- Footer -->
    <div th:include="admin/template_admin.html::footer"></div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
