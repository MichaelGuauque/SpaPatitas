<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpaPatitas | Administrar Citas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="icon" type="image/png" th:href="@{/img/Logo solo-02-02.png}">
    <link rel="stylesheet" th:href="@{/style/principal.css}">
    <link rel="stylesheet" th:href="@{/style/clientes.css}">
</head>
<body>
<!-- left var -->
<div th:include="admin/template_admin.html::header"></div>

<main>
    <div class="right-content">

        <div class="panel-informacion">
            <h2>Administra la información de los clientes de Spa Patitas. Desde aquí, puedes consultar la lista de
                clientes, modificar sus datos y guardar la información actualizada en el sistema.</h2>
        </div>
        <div class="crear-producto" style="background-color: #FFFAF9; border-radius: 10px;">

            <h3>Informacion Cliente</h3>

            <div class="container mt-5" style="background-color: #FFFFFF;">
                <form th:action="@{/clientes/actualizar}" method="post">
                    <input type="hidden" name="idCliente" th:value="${cliente.idCliente}" />

                    <div class="row" style="background-color: #FFFFFF;">
                        <!-- Primer Nombre -->
                        <div class="col-md-6 mb-3" style="background-color: #FFFFFF;">
                            <input type="text" class="form-control" name="primerNombre" id="primerNombre" th:value="${cliente.primerNombre}"
                                   placeholder="Primer Nombre.">
                        </div>
                        <!-- Segundo Nombre -->
                        <div class="col-md-6 mb-3" style="background-color: #FFFFFF;">
                            <input type="text" class="form-control" name="segundoNombre" id="segundoNombre" th:value="${cliente.segundoNombre}"
                                   placeholder="Segundo Nombre.">
                        </div>
                    </div>

                    <div class="row" style="background-color: #FFFFFF;">
                        <!-- Primer Apellido -->
                        <div class="col-md-6 mb-3" style="background-color: #FFFFFF;">
                            <input type="text" class="form-control" name="primerApellido" id="primerApellido" th:value="${cliente.primerApellido}"
                                   placeholder="Primer Apellido.">
                        </div>
                        <!-- Segundo Apellido -->
                        <div class="col-md-6 mb-3" style="background-color: #FFFFFF;">
                            <input type="text" class="form-control" name="segundoApellido" id="segundoApellido" th:value="${cliente.segundoApellido}"
                                   placeholder="Segundo Apellido.">
                        </div>
                    </div>

                    <div class="row" style="background-color: #FFFFFF;">
                        <!-- Numero de documento -->
                        <div class="col-md-6 mb-3" style="background-color: #FFFFFF;">
                            <input type="number" class="form-control" name="cedula" id="cedula" th:value="${cliente.cedula}"
                                   placeholder="No. de documento.">
                        </div>
                        <!-- Telefono -->
                        <div class="col-md-6 mb-3" style="background-color: #FFFFFF;">
                            <input type="number" class="form-control" name="telefono" id="telefono" th:value="${cliente.telefono}"
                                   placeholder="Número celular">
                        </div>
                    </div>

                    <div class="row" style="background-color: #FFFFFF;">
                        <!-- Genero -->
                        <div class="col-md-6 mb-3" style="background-color: #FFFFFF;">
                            <select class="form-select" name="genero" aria-label="Seleccione su género">
                                <option value="" selected>Seleccione su genero.</option>
                                <th:block th:each="genero : ${generos}">
                                    <option th:value="${genero}"
                                            th:text="${genero}"
                                            th:selected="${genero == cliente.genero}"
                                    ></option>
                                </th:block>
                            </select>
                        </div>
                        <!-- Fecha Nacimiento-->
                        <div class="col-md-6 mb-3" style="background-color: #FFFFFF;">
                            <input type="date" class="form-control" name="fechaNacimiento" id="fechaNacimiento" th:value="${cliente.fechaNacimiento}"
                                   placeholder="Fecha Nacimiento">
                        </div>
                    </div>

                    <div class="row" style="background-color: #FFFFFF;">
                        <!-- Direccion  -->
                        <div class="col-md-12 mb-3" style="background-color: #FFFFFF;">
                            <input type="text" class="form-control" name="direccion" id="direccion" th:value="${cliente.direccion}"
                                   placeholder="Dirección">
                        </div>
                    </div>

                    <div class="row" style="background-color: #FFFFFF;">
                        <!-- Correo-->
                        <div class="col-md-6 mb-3" style="background-color: #FFFFFF;">
                            <input type="email" class="form-control" name="username" id="username"  th:value="${cliente.usuario.username}"
                                   placeholder="Correo">
                        </div>
                        <!-- Contrasenia -->
                        <div class="col-md-6 mb-3" style="background-color: #FFFFFF;">
                            <input type="password" class="form-control" name="password" id="password" th:value="${cliente.usuario.password}"
                                   placeholder="Contraseña" disabled>
                        </div>
                    </div>

                    <!-- Botón de enviar -->
                    <div class="col-md-12 mb-3" style="background-color: #FFFFFF;">
                        <!-- Botones de Enviar y Cancelar -->
                        <div id="botones" class="d-flex justify-content-center gap-3 mt-3">
                            <button type="submit" class="btn btn-primary w-25"
                                    style="background-color: #F2B243; border-style: none;">Guardar
                            </button>
                            <button type="button" class="btn btn-secondary w-25"
                                    onclick="window.location.href='/'">
                                Cancelar
                            </button>
                        </div>
                    </div>
                </form>
            </div>

        </div>


        <div class="tabla">
            <div class="tabla-encabezado">
                <h3 id="pequeño">Clientes</h3>
                <div class="buscador-contenedor">
                    <form>
                        <input class="buscador" type="number" placeholder="Buscar Cliente...">
                        <button class="boton-buscar" type="submit"><img src="./img/Search.png"></button>
                    </form>
                </div>
            </div>
            <!-- Contenedor con scroll -->
            <div class="tabla-contenedor">
                <table id="tablitaScroll" class="table table-striped table-hover">
                    <thead>
                    <tr>
                        <th scope="col">Primer Nombre</th>
                        <th scope="col">Primer Apellido</th>
                        <th scope="col">Cedula</th>
                        <th scope="col">Telefono</th>
                        <th scope="col">Direccion</th>
                        <th scope="col">Acción</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="c:${clientes}">
                        <td th:text="${c.primerNombre}"></td>
                        <td th:text="${c.primerApellido}"></td>
                        <td th:text="${c.cedula}"></td>
                        <td th:text="${c.telefono}"></td>
                        <td th:text="${c.direccion}"></td>
                        <td style="display: flex; flex-direction: column; gap: 7px;">
<!--                            <a style="display:flex; justify-content: center; color: #010101; border-radius: 10px; background-color: #e6e8e4; border: 2px solid black; text-decoration: none;"-->
<!--                               th:href="@{clientes/editar/{codigo} (codigo = ${p.codigo})}">Modificar</a>-->
                            <a style="display:flex; justify-content: center; color: #010101; border-radius: 10px; background-color: #e6e8e4; border: 2px solid black; text-decoration: none;"
                               >Modificar</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    </div>

    <!-- Footer -->
    <div th:include="admin/template_admin.html::footer"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
