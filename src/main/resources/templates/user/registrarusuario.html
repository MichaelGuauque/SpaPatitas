<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpaPatitas | Registrar</title>
    <link rel="stylesheet" th:href="@{/style/style.css}">
    <link rel="icon" type="image/png" th:href="@{/img/Solo logo Blanco.png}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body style="background-color: #E0E0E0;">
    <div class="div-img">
        <img class="img-login" th:src="@{/img/Mask group dog.png}">
    </div>

    <div class="login">
        <img class="img-icon" th:src="@{/img/icon _Paw_.png}">
        <h1>Crea una Cuenta</h1>
        <p>Ingresa tus datos para crear una cuenta</p>
        <img class="img-line" th:src="@{/img/Line.png}">
        <div class="container mt-5" style="background-color: #FFFFFF;">
            <form th:action="@{/user/guardar}" method="post">
                <div class="row" style="background-color: #FFFFFF;">
                    <!-- Primer Nombre -->
                    <div class="col-md-6 mb-3" style="background-color: #FFFFFF;">
                        <input type="text" class="form-control" name="primerNombre" id="primerNombre" placeholder="Primer Nombre.">
                    </div>
                    <!-- Segundo Nombre -->
                    <div class="col-md-6 mb-3" style="background-color: #FFFFFF;">
                        <input type="text" class="form-control" name="segundoNombre" id="segundoNombre" placeholder="Segundo Nombre.">
                    </div>
                </div>
                
                <div class="row" style="background-color: #FFFFFF;">
                    <!-- Primer Apellido -->
                    <div class="col-md-6 mb-3" style="background-color: #FFFFFF;">
                        <input type="text" class="form-control" name="primerApellido" id="primerApellido" placeholder="Primer Apellido.">
                    </div>
                    <!-- Segundo Apellido -->
                    <div class="col-md-6 mb-3" style="background-color: #FFFFFF;">
                        <input type="text" class="form-control" name="segundoApellido" id="segundoApellido" placeholder="Segundo Apellido.">
                    </div>
                </div>
                
                <div class="row" style="background-color: #FFFFFF;">
                    <!-- Numero de documento -->
                    <div class="col-md-6 mb-3" style="background-color: #FFFFFF;">
                        <input type="number" class="form-control" name="cedula" id="cedula" placeholder="No. de documento.">
                    </div>
                    <!-- Telefono -->
                    <div class="col-md-6 mb-3" style="background-color: #FFFFFF;">
                        <input type="number" class="form-control" name="telefono" id="telefono" placeholder="Número celular">
                    </div>
                </div>
        
                <div class="row" style="background-color: #FFFFFF;">
                    <!-- Genero -->
                    <div class="col-md-6 mb-3" style="background-color: #FFFFFF;">
                        <select class="form-select" name="genero" aria-label="Seleccione su género">
                            <option value="" selected>Seleccione su genero.</option>
                            <th:block th:each="genero : ${generos}">
                                <option th:value="${genero}" th:text="${genero}"></option>
                            </th:block>
                        </select>
                    </div>
                    <!-- Fecha Nacimiento-->
                    <div class="col-md-6 mb-3" style="background-color: #FFFFFF;">
                        <input type="date" class="form-control" name="fechaNacimiento" id="fechaNacimiento" placeholder="Fecha Nacimiento">
                    </div>
                </div>
        
                <div class="row" style="background-color: #FFFFFF;">
                    <!-- Direccion  -->
                    <div class="col-md-12 mb-3" style="background-color: #FFFFFF;">
                        <input type="text" class="form-control" name="direccion" id="direccion" placeholder="Dirección">
                    </div>
                </div>

                <div class="row" style="background-color: #FFFFFF;">
                    <!-- Correo-->
                    <div class="col-md-6 mb-3" style="background-color: #FFFFFF;">
                        <input type="email" class="form-control" name="username" id="username" placeholder="Correo">
                    </div>
                    <!-- Contrasenia -->
                    <div class="col-md-6 mb-3" style="background-color: #FFFFFF;">
                        <input type="password" class="form-control" name="password" id="password" placeholder="Contraseña">
                    </div>
                </div>
                
                <!-- Botón de enviar -->
                <div class="col-md-12 mb-3" style="background-color: #FFFFFF;">
                    <button type="submit" class="btn btn-primary w-100" style="background-color: #F2B243; border-style: none;">Enviar</button>
                </div>
            </form>
        </div>
        <img class="img-line" th:src="@{/img/Line.png}">
        <div class="div-registrar">
            <p>Ya tienes una cuenta?</p>
            <a class="boton-registrar" th:href="@{/user/login}">Inicia Sesión</a>
        </div>
    </div>
</body>
</html>
