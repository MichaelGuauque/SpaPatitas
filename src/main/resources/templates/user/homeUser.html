<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpaPatitas | Inicio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="icon" type="image/png" th:href="@{/img/Solo logo Blanco.png}">
    <link rel="stylesheet" th:href="@{/style/principal.css}">

</head>
<body>
<!-- left var -->
    <div th:include="user/template_user.html::header-user"></div>

    <main>
        <div class="right-content">
            <div class="right-botones">
                <a class="boton-registrar" th:href="@{/user/registrar}">Registrate</a>
                <a class="boton-iniciar" th:href="@{/user/login}">Inicia Sesión</a>
                <a class="boton-carrito" th:href="@{/user/carrito}"><img class="icons-menu" th:src="@{/img/Shopping cart.png}">Carrito</a>
            </div>
            <div class="right-content-info">
                <div class="right-content-info-izquierda">
                    <h1 id="tituloPrincipal">Cuidado y relax para tu mejor amigo.</h1>
                    <p class="texto">Relajación, estilo y amor para tu peludo, todo en un solo lugar.</p>
                    <p class="texto2">Explora nuestro servicio o compra productos para tu mascota.</p>
                    <img class="img-linea" src="./img/Line.png">
                    <div class="botones-direccionamiento">
                        <a class="boton-producto" th:href="@{/user/productos}">Productos</a>
                        <a class="boton-servicio" href="#">Servicios</a>
                    </div>
                </div>
                <div class="right-content-info-derecha">
                    <img class="img-perro" th:src="@{/img/perro.png}">
                </div>
            </div>
        </div>
        <div th:include="admin/template_admin.html::footer"></div>
    </main>
</body>
</html>
