<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpaPatitas | Mi Carrito</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="icon" type="image/png" th:href="@{/img/Solo logo Blanco.png}">
    <link rel="stylesheet" th:href="@{/style/principal.css}">
    <style>
        .container-carrito {
            display: flex;
            gap: 2rem;
        }
        .productos {
            flex: 2;
            max-height: 60vh;
            overflow-y: auto;
        }
        .referencia {
            flex: 1;
            text-align: center;
        }
    </style>
</head>

<body>
<div th:include="user/template_user.html::header-user"></div>

<main class="mt-4">
    <div class="container-carrito">
        <!-- Productos -->
        <div class="productos">
            <h3 id="pequeño2">Carrito</h3>
            <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-4">
                <div class="col" th:each="dVenta : ${carrito}">
                    <div class="card h-100">
                        <div class="card-body">
                            <img th:src="@{'/images/' + ${dVenta.producto.imagen}}" class="card-img-top" alt="Producto">
                            <h5 class="card-title" th:text="${dVenta.producto.nombre}"></h5>
                            <p class="card-text">Cantidad: <span th:text="${dVenta.cantidad}"></span></p>
                            <p class="card-text">Total: <span th:text="${dVenta.total}"></span></p>
                            <a th:href="@{/user/delete/carrito/{codigo}(codigo=${dVenta.producto.codigo})}"
                               class="btn btn-danger btn-sm">Eliminar</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Imagen de referencia -->
        <div class="referencia">
            <img class="img-Compra" th:src="@{/img/kompraa.png}" alt="Imagen compra" style="max-width: 100%;">
        </div>
    </div>

    <!-- Totales (Debajo de productos e imagen) -->
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center">
            <div>
                <p><strong>Sub Total:</strong> $<span th:text="${sumaSubTotal}"></span></p>
                <p><strong>Impuestos:</strong> $<span th:text="${ivaComp}"></span></p>
                <p><strong>Total:</strong> $<span th:text="${sumaTotal}"></span></p>
            </div>
            <div>
                <a th:href="@{/procesarCompra}" class="btn btn-success mb-2">Proceder con el pago</a>
                <a th:href="@{/user/productos}" class="btn btn-primary">Seguir Comprando</a>
            </div>
        </div>
    </div>
    <div th:include="admin/template_admin.html::footer"></div>
</main>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<!--<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.-->
</body>
</html>
