<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpaPatitas | Servicios</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="icon" type="image/png" th:href="@{/img/Solo logo Blanco.png}">
  <link rel="stylesheet" th:href="@{/style/stylAm.css}">
</head>
<body>
<!-- left var -->
<div th:include="admin/template_admin.html::header"></div>

<main>
  <div class="right-content">
    <div class="panel-informacion">
      <h2>Administra la lista de servicios ofrecidos en Spa Patitas: consulta servicios disponibles, añade nuevos servicios y modifica la información de los servicios existentes.</h2>
    </div>

    <div class="crear-producto" style="background-color: #FFFAF9; border-radius: 10px;">

      <h3>Información del Servicio</h3>

      <div class="container mt-5" style="background-color: #FFFAF9;">
        <form th:action="@{/servicios/actualizar}" method="post" enctype="multipart/form-data">
          <!-- Primera fila: Nombre del servicio, Precio al público, Coste interno -->

          <div class="row mb-3">
            <!-- Primer Imput Oculto -->
            <input type="hidden" name="id" th:value="${servicio.id}" />
            <div class="col-md-4">
              <label for="nombreServicio" class="form-label">Nombre del Servicio</label>
              <input type="text" class="form-control" id="nombreServicio" name="nombreServicio" placeholder="Ingrese el nombre del servicio" th:value="${servicio.nombreServicio}" required>
            </div>
            <div class="col-md-4">
              <label for="precioPublico" class="form-label">Precio al Público</label>
              <input type="number" min="1" class="form-control" id="precioPublico" name="precioPublico" placeholder="Ingrese el precio al público" th:value="${servicio.precioPublico}" required>
            </div>
            <div class="col-md-4">
              <label for="costoInterno" class="form-label">Coste Interno</label>
              <input type="number" class="form-control" min="1" id="costoInterno" name="costoInterno" placeholder="Ingrese el coste interno" th:value="${servicio.costoInterno}" required>
            </div>
          </div>

          <!-- Segunda fila: Información del servicio, Estado -->
          <div class="row mb-3">
            <div class="col-md-6">
              <label for="descripcion" class="form-label">Información del Servicio</label>
              <textarea class="form-control" id="descripcion" rows="5" name="descripcion" placeholder="Ingrese información sobre el servicio" th:text="${servicio.descripcion}" required></textarea>
            </div>
            <div class="col-md-6">
              <label for="estadoServicio" class="form-label">Estado</label>
              <select class="form-select" id="estadoServicio" name="estado" th:value="${servicio.estado}" required>
                <option value="1" style="background-color: #FFFFFF;"  th:selected="${servicio.estado == true}">Habilitado</option>
                <option value="0" style="background-color: #FFFFFF;" th:selected="${servicio.estado == false}">Deshabilitado</option>
              </select>
            </div>
          </div>
          <div class="row">
            <!-- Botones de Enviar y Cancelar -->
            <div id="botones" class="col-md-4 mb-3" style="display: flex;">
              <button type="submit" class="btn btn-primary w-50 me-2" style="background-color: #F2B243; border-style: none;">Guardar</button>
              <button type="button" class="btn btn-secondary w-50" onclick="window.history.back()">Cancelar</button>
            </div>

          </div>
        </form>
      </div>
    </div>


  </div>



  <!-- Footer -->
  <div th:include="admin/template_admin.html::footer"></div>

</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>


</body>
</html>
