<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpaPatitas | Servicios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="icon" type="image/png" th:href="@{/img/Solo logo Blanco.png}">
    <link rel="stylesheet" th:href="@{/style/stylAm.css}">
</head>
<body>
<!-- left var -->
<div th:include="admin/template_admin.html::header"></div>

<main>
    <div class="right-content">
        <div class="panel-informacion">
            <h2>Administra la lista de servicios ofrecidos en Spa Patitas: consulta servicios disponibles, añade nuevos servicios y modifica la información de los servicios existentes.</h2>
        </div>

        <div class="crear-producto" style="background-color: #FFFAF9; border-radius: 10px;">

            <h3>Información del Servicio</h3>

            <div class="container mt-5" style="background-color: #FFFAF9;">
                <form th:action="@{/servicios/crear}" method="post" enctype="multipart/form-data">
                    <!-- Primera fila: Nombre del servicio, Precio al público, Coste interno -->
                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label for="nombreServicio" class="form-label">Nombre del Servicio</label>
                            <input type="text" class="form-control" id="nombreServicio" name="nombreServicio" placeholder="Ingrese el nombre del servicio" required>
                        </div>
                        <div class="col-md-4">
                            <label for="precioPublico" class="form-label">Precio al Público</label>
                            <input type="number" class="form-control" id="precioPublico" name="precioPublico" placeholder="Ingrese el precio al público" required>
                        </div>
                        <div class="col-md-4">
                            <label for="costoInterno" class="form-label">Coste Interno</label>
                            <input type="number" class="form-control" id="costoInterno" name="costoInterno" placeholder="Ingrese el coste interno" required>
                        </div>
                    </div>

                    <!-- Segunda fila: Información del servicio, Estado -->
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="descripcion" class="form-label">Información del Servicio</label>
                            <textarea class="form-control" id="descripcion" rows="5" name="descripcion" placeholder="Ingrese información sobre el servicio" required></textarea>
                        </div>
                        <div class="col-md-6">
                            <label for="estadoServicio" class="form-label">Estado</label>
                            <select class="form-select" id="estadoServicio" name="estado" required>
                                <option value="true">HABILITADO</option>
                                <option value="false">DESHABILITADO</option>
                            </select>
                        </div>
                    </div>
                    <div class="row">
                        <!-- Botones de Enviar y Cancelar -->
                        <div id="botones" class="col-md-4 mb-3" style="display: flex;">
                            <button type="submit" class="btn btn-primary w-50 me-2" style="background-color: #F2B243; border-style: none;" >Guardar</button>
                            <button type="button" class="btn btn-secondary w-50" onclick="resetFormAndShowAlert()">Cancelar</button>
                        </div>

                        <!-- Alerta de Cancelación -->
                        <div id="alerta-cancelacion" class="alert alert-warning alert-dismissible fade show" role="alert" style="display: none;">
                            Proceso cancelado.
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>

                    </div>

                    <script>
                        // Función para reiniciar el formulario y mostrar el mensaje de cancelación
                        function resetFormAndShowAlert() {
                            const form = document.querySelector('form'); // Selecciona el formulario
                            form.reset(); // Limpia los campos del formulario

                            const alertaCancelacion = document.getElementById('alerta-cancelacion');
                            alertaCancelacion.style.display = "block"; // Muestra la alerta de cancelación

                            // Ocultar automáticamente la alerta después de 3 segundos
                            setTimeout(() => {
                                alertaCancelacion.style.display = "none";
                            }, 3000);
                        }
                    </script>
                </form>
            </div>
        </div>

        <div class="tabla">
            <div class="tabla-encabezado">
                <h3 id="pequeño2">Servicios Disponibles</h3>
                <div>
                    <form th:action="@{/servicios/buscar}" method="get">
                        <input class="buscador" type="number" name="id" placeholder="Código del Servicio" required>
                        <button class="boton-buscar" type="submit"><img th:src="@{/img/Search.png}" alt="Buscar"></button>
                    </form>
                </div>
            </div>
            <table id="tablita" class="table table-striped table-hover">
                <thead>
                <tr>
                    <th scope="col">Nombre del Servicio</th>
                    <th scope="col">$ Publico</th>
                    <th scope="col">Codigo</th>
                    <th scope="col">Estado</th>
                    <th scope="col"></th>
                </tr>
                </thead>
                <tbody>
                    <tr th:each="servicio:${servicios}">
                        <th scope="row" th:text="${servicio.nombreServicio}" ></th>
                        <td th:text="${servicio.precioPublico}" ></td>
                        <td th:text="${servicio.id}" ></td>
                        <td th:text="${servicio.estado} ? 'Habilitado' : 'Deshabilitado'" ></td>
                        <td style="display: flex; flex-direction: column; gap: 7px;">
                            <div class="d-flex flex-column justify-content-right" id="botoTabla" >
                        <a class="btn btn-primary mb-2" id="botonesMasco2" th:href="@{/servicios/editar/{id}(id=${servicio.id})}">Modificar</a>
                        <form th:action="@{/servicios/cambiarEstado/{id}(id=${servicio.id})}" method="post">
                            <button type="submit" class="btn btn-secondary" id="botonesMasco" >
                                <span th:text="${servicio.estado} ? 'Deshabilitar' : 'Habilitar'"></span>
                            </button>
                        </form>
                            </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>



<!-- Footer -->
    <div th:include="admin/template_admin.html::footer"></div>

</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>


</body>
</html>
